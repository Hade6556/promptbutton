<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dash on your desktop</title>
<!--
  Prototype: Dash as a desktop companion for the First Try Mac app. One file, no dependencies.
  The mascot is the app's own 3D Dash (src/mascot/dash.ts and dash3d.ts, the one on the landing page), inlined below
  from site/assets/dash.js. With reduced motion, or without WebGL 2, it is the flat drawing.
  Nothing here calls the product: the drafts, the question and the rewritten prompt are canned.
-->
<style>
  :root {
    /* The landing page's palette. */
    --plum-900: #140c1c; --surface: #1a1023; --surface-2: #221530; --surface-3: #2e1c3c;
    --line: #352442; --line-2: #4d3659;
    --cream: #f6f2ee; --text-2: #d9cad6; --text-3: #a994ab;
    --pink: #e0668f; --rose: #ffa7a0; --peach: #ffd9a8;
    --pill-ink: #1d1d1f;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif;
    /* The fake desktop: what macOS keeps for itself. Dash stays inside what is left. */
    --menubar: 28px; --dock: 84px;
    --spring: cubic-bezier(0.2, 1.25, 0.4, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 var(--font); color: #1d1d1f; overflow: hidden;
    background: linear-gradient(160deg, #26335f 0%, #5d4688 52%, #c97f8c 100%);
    -webkit-font-smoothing: antialiased;
  }
  body[data-wall='light'] { background: linear-gradient(160deg, #e9eef6 0%, #f3e9f1 55%, #fbe7d8 100%); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  /* ---------- the fake desktop (not part of the design) ---------- */
  .menubar {
    position: fixed; inset: 0 0 auto; height: var(--menubar); padding: 0 14px; display: flex; align-items: center; gap: 18px;
    font-size: 13px; color: #fff; background: rgba(20, 16, 30, 0.34); backdrop-filter: blur(20px);
  }
  body[data-wall='light'] .menubar { color: #1d1d1f; background: rgba(255, 255, 255, 0.5); }
  .menubar b { font-weight: 600; }
  .menubar .right { margin-left: auto; font-variant-numeric: tabular-nums; }
  .dock {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); height: 68px; padding: 8px; display: flex; gap: 8px;
    border-radius: 22px; background: rgba(255, 255, 255, 0.22); border: 1px solid rgba(255, 255, 255, 0.28); backdrop-filter: blur(20px);
  }
  .dock i { width: 52px; height: 52px; border-radius: 13px; background: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .controls {
    position: fixed; top: calc(var(--menubar) + 10px); left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; width: max-content; max-width: calc(100vw - 32px);
    padding: 6px 8px 6px 12px; border-radius: 12px; font-size: 12px; color: #fff; background: rgba(20, 16, 30, 0.55); backdrop-filter: blur(16px);
  }
  .controls span { opacity: 0.8; margin-right: 4px; }
  .controls button {
    height: 28px; padding: 0 10px; border: 0; border-radius: 8px; cursor: pointer; background: rgba(255, 255, 255, 0.14); color: #fff;
  }
  .controls button:hover { background: rgba(255, 255, 255, 0.24); }
  .controls button[aria-pressed='true'] { background: #fff; color: #1d1d1f; }
  kbd { font: 600 11px/1 var(--font); padding: 2px 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.18); margin-left: 4px; }
  .controls button[aria-pressed='true'] kbd { background: rgba(0, 0, 0, 0.1); }

  .app {
    position: fixed; left: 50%; top: 54%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 48px)); height: min(420px, calc(100vh - 240px));
    display: flex; flex-direction: column; border-radius: 12px; background: #fff; overflow: hidden;
    box-shadow: 0 30px 80px rgba(10, 8, 24, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .app .bar { height: 38px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 13px; background: #f3f2f5; border-bottom: 1px solid #e3e1e8; font-size: 13px; color: #55515e; }
  .app .bar i { width: 12px; height: 12px; border-radius: 50%; background: #d1ced8; }
  .app .bar span { margin-left: 8px; font-weight: 600; }
  .app .thread { flex: 1; min-height: 0; padding: 22px; color: #55515e; }
  .app .thread p { margin: 0; max-width: 46ch; }
  .app .field {
    margin: 0 14px 14px; padding: 11px 13px; min-height: 46px; max-height: 190px; overflow: auto; border-radius: 12px; border: 1px solid #d9d6e0;
    white-space: pre-wrap; color: #1d1d1f; transition: box-shadow 0.4s;
  }
  .app .field::after { content: ''; display: inline-block; width: 1.5px; height: 1.05em; margin-left: 1px; vertical-align: -0.15em; background: #1d1d1f; animation: caret 1.1s steps(1) infinite; }
  .app .field.is-filled { box-shadow: 0 0 0 3px rgba(224, 102, 143, 0.28); }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---------- Dash on the desktop ---------- */
  .pet {
    position: fixed; left: 0; top: 0; z-index: 10; width: 72px; height: 67px;
    transform: translate3d(var(--x, 0px), var(--y, 0px), 0); transition: opacity 1.2s;
  }
  .pet.is-dim:not(:hover) { opacity: 0.72; }
  .pet-btn { all: unset; display: block; width: 72px; height: 67px; cursor: grab; touch-action: none; border-radius: 20px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .pet-btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }
  .pet.is-drag .pet-btn { cursor: grabbing; }
  /* 56 px at rest, 72 px while it talks. Drawn at 72 so that it is never scaled up. */
  .pet-grow { display: block; transform-origin: 50% 60%; transform: scale(0.78); transition: transform 0.42s var(--spring), opacity 0.2s; filter: drop-shadow(0 3px 7px rgba(10, 6, 20, 0.3)); }
  .pet.is-awake .pet-grow, .pet.is-drag .pet-grow { transform: none; }
  .pet.is-away .pet-grow { transform: scale(0); opacity: 0; }
  .pet.is-away { pointer-events: none; }
  /* Held by the top of its head: it swings and stretches with the speed of the drag (set every frame by the script). */
  .pet-body { display: block; transform-origin: 50% 8%; transform: rotate(var(--tilt, 0deg)) scale(var(--sx, 1), var(--sy, 1)); will-change: transform; }
  .pet-body canvas { pointer-events: none; }
  .pet.is-settle .pet-body { animation: settle 0.5s ease-out; }
  @keyframes settle { 35% { scale: 1.1 0.86; } 70% { scale: 0.97 1.04; } }

  /* The shortcut, shown when the pointer rests on a dozing Dash. */
  .pet-hint {
    position: absolute; padding: 4px 8px; border-radius: 8px; font: 600 12px/1.2 var(--font); white-space: nowrap; color: var(--cream); background: var(--surface);
    border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(20, 12, 28, 0.16); opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .pet[data-state='idle']:hover:not(.is-drag):not(.has-menu) .pet-hint { opacity: 1; transition-delay: 0.5s; }

  /* Two drops of Dash lead from it to the bubble. */
  .trail i { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(10, 6, 20, 0.35); transform: scale(0); transition: transform 0.16s var(--spring); }
  .trail i:nth-child(1) { width: 6px; height: 6px; }
  .trail i:nth-child(2) { width: 9px; height: 9px; }
  .pet.is-open .trail i { transform: none; }
  .pet.is-open .trail i:nth-child(1) { transition-delay: 0.1s; }
  .pet.is-open .trail i:nth-child(2) { transition-delay: 0.17s; }
  .pet.is-drag .trail, .pet.is-drag .bubble { opacity: 0 !important; transition: opacity 0.1s; pointer-events: none; }

  /* What Dash says is a small pane of glass: you see the desktop through it, blurred and dimmed just enough that cream
     text stays readable over anything, a white window included (5:1 or better there). Cream is the only accent. */
  .bubble, .pet-hint, .pet-menu {
    --surface: rgba(24, 14, 32, 0.4); --surface-2: rgba(246, 242, 238, 0.12); --surface-3: rgba(246, 242, 238, 0.18);
    --line: rgba(246, 242, 238, 0.28); --line-2: rgba(246, 242, 238, 0.36);
    --cream: #f6f2ee; --text-2: rgba(246, 242, 238, 0.9); --text-3: rgba(246, 242, 238, 0.8); --plum-900: rgba(246, 242, 238, 0.1); --rose: #f6f2ee; --peach: #ffe9c9;
    -webkit-backdrop-filter: blur(22px) saturate(1.5) brightness(0.5); backdrop-filter: blur(22px) saturate(1.5) brightness(0.5);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .bubble, .pet-hint, .pet-menu { --surface: #2a2030; } }
  @media (prefers-reduced-transparency: reduce) { .bubble, .pet-hint, .pet-menu { --surface: #2a2030; -webkit-backdrop-filter: none; backdrop-filter: none; } }
  .bubble {
    position: absolute; width: 248px; max-width: calc(100vw - 100px); max-height: min(220px, calc(100vh - var(--menubar) - 20px));
    display: flex; flex-direction: column; padding: 10px 12px; font-size: 13px; color: var(--cream); background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 24px rgba(20, 12, 28, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transform-origin: var(--ox) var(--oy); transform: scale(0.15); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform 0.24s cubic-bezier(0.5, 0, 0.8, 0.4), opacity 0.2s 0.06s, visibility 0s 0.26s;
  }
  .pet.is-open .bubble {
    transform: none; opacity: 1; visibility: visible; pointer-events: auto;
    transition: transform 0.28s var(--spring) 0.22s, opacity 0.12s 0.22s, visibility 0s;
  }
  .bubble-in { display: flex; flex-direction: column; min-height: 0; gap: 8px; opacity: 0; transition: opacity 0.09s; }
  .pet.is-text .bubble-in { opacity: 1; transition: opacity 0.18s 0.4s; }

  /* Where the bubble opens: on the side with more room, its sharp corner towards Dash. The script picks the side from
     where Dash sits, and --nudge slides the bubble back along the edge when it would leave the screen. */
  .pet[data-corner='br'] { --ox: 100%; --oy: 100%; }
  .pet[data-corner='bl'] { --ox: 0%; --oy: 100%; }
  .pet[data-corner='tr'] { --ox: 100%; --oy: 0%; }
  .pet[data-corner='tl'] { --ox: 0%; --oy: 0%; }
  .pet[data-corner$='r'] .bubble { right: calc(100% - 6px); }
  .pet[data-corner$='l'] .bubble { left: calc(100% - 6px); }
  .pet[data-corner^='b'] .bubble { bottom: calc(100% - 12px - var(--nudge, 0px)); }
  .pet[data-corner^='t'] .bubble { top: calc(100% - 12px - var(--nudge, 0px)); }
  .pet[data-corner='br']:not(.is-nudged) .bubble { border-bottom-right-radius: 5px; }
  .pet[data-corner='bl']:not(.is-nudged) .bubble { border-bottom-left-radius: 5px; }
  .pet[data-corner='tr']:not(.is-nudged) .bubble { border-top-right-radius: 5px; }
  .pet[data-corner='tl']:not(.is-nudged) .bubble { border-top-left-radius: 5px; }
  .pet[data-corner$='r'] .trail i:nth-child(1) { right: calc(100% - 4px); }
  .pet[data-corner$='r'] .trail i:nth-child(2) { right: calc(100% + 7px); }
  .pet[data-corner$='l'] .trail i:nth-child(1) { left: calc(100% - 4px); }
  .pet[data-corner$='l'] .trail i:nth-child(2) { left: calc(100% + 7px); }
  .pet[data-corner^='b'] .trail i:nth-child(1) { bottom: calc(100% - 6px); }
  .pet[data-corner^='b'] .trail i:nth-child(2) { bottom: calc(100% + 3px); }
  .pet[data-corner^='t'] .trail i:nth-child(1) { top: calc(100% - 6px); }
  .pet[data-corner^='t'] .trail i:nth-child(2) { top: calc(100% + 3px); }
  .pet.is-nudged .trail { display: none; }
  .pet:has([data-render='3d']) .trail { display: none; } /* the 3D Dash carries its own two drops */
  .pet[data-corner$='r'] .pet-hint, .pet[data-corner$='r'] .pet-menu { right: 0; }
  .pet[data-corner$='l'] .pet-hint, .pet[data-corner$='l'] .pet-menu { left: 0; }
  .pet[data-corner^='b'] .pet-hint, .pet[data-corner^='b'] .pet-menu { bottom: calc(100% + 2px); }
  .pet[data-corner^='t'] .pet-hint, .pet[data-corner^='t'] .pet-menu { top: calc(100% + 2px); }

  /* ---------- what Dash says ---------- */
  /* The answer keeps to about five lines and scrolls inside; the last line fades while there is more below. */
  .say { position: relative; min-height: 0; max-height: 96px; overflow: auto; overscroll-behavior: contain; line-height: 1.45; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .say.has-more { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); }
  .say p { margin: 0 0 6px; }
  .say p:last-child { margin-bottom: 0; }
  .say .lead { font-weight: 600; }
  .say .w { opacity: 0; transition: opacity 0.2s; }
  .say .w.on { opacity: 1; }
  .say mark { color: var(--peach); background: rgba(255, 233, 201, 0.16); border-radius: 4px; padding: 0 1px; }
  .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--peach); animation: dot 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%, 70%, 100% { opacity: 0.3; transform: none; } 35% { opacity: 1; transform: translateY(-3px); } }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    height: 28px; padding: 0 10px; border-radius: 14px 14px 14px 5px; border: 1px solid var(--line-2); background: transparent; color: var(--cream); cursor: pointer;
  }
  .chip:hover { background: var(--surface-3); border-color: var(--text-3); }
  .act { display: flex; justify-content: flex-end; }
  .pill {
    flex: none; height: 28px; padding: 0 11px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--pill-ink); background: #f6f2ee;
  }
  .pill:hover { background: #ffffff; }
  .pill:active { transform: translateY(1px); }
  .pill:focus-visible, .chip:focus-visible { outline: 1.5px solid rgba(246, 242, 238, 0.7); outline-offset: 2px; }
  .pill kbd { background: rgba(29, 29, 31, 0.1); color: inherit; }
  .pet-hint kbd { background: var(--surface-3); color: var(--text-2); margin: 0 2px 0 0; }
  [hidden] { display: none !important; }

  /* Right-click on Dash. */
  .pet-menu {
    position: absolute; min-width: 210px; padding: 5px; border-radius: 12px; color: var(--cream); background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(20, 12, 28, 0.2); font-size: 13px;
  }
  .pet-menu button { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .pet-menu button:hover, .pet-menu button:focus-visible { background: var(--surface-3); outline: 0; }

  /* Reduced motion: poses still change, nothing travels. The bubble fades in place. */
  .calm *, .calm *::after { animation: none !important; }
  .calm .pet, .calm .pet-grow, .calm .trail i, .calm .dash, .calm .dash * { transition: none !important; }
  .calm .pet-body { transform: none; }
  .calm .dash .d-eyes { transform: none !important; } /* no following the pointer; a mood's own gaze still applies */
  .calm .bubble, .calm .pet.is-open .bubble { transform: none; transition: opacity 0.15s, visibility 0s; }
  .calm .bubble-in, .calm .pet.is-text .bubble-in { transition: opacity 0.12s; }
  .calm .say .w { transition: none; }
</style>
</head>
<body>
  <div class="menubar"><b>Chat</b><span>File</span><span>Edit</span><span>View</span><span class="right" id="clock"></span></div>

  <div class="controls" role="group" aria-label="Prototype controls">
    <span>Prototype controls</span>
    <button type="button" data-do="shortcut">Shortcut <kbd>P</kbd></button>
    <button type="button" data-do="thinking">Thinking <kbd>T</kbd></button>
    <button type="button" data-do="question">Question <kbd>Q</kbd></button>
    <button type="button" data-do="error">Error <kbd>E</kbd></button>
    <button type="button" data-do="dismiss">Dismiss <kbd>Esc</kbd></button>
    <button type="button" data-do="calm" aria-pressed="false">Reduced motion <kbd>M</kbd></button>
    <button type="button" data-do="wall" aria-pressed="false">Light wallpaper <kbd>W</kbd></button>
    <button type="button" data-do="reset">Reset</button>
  </div>

  <main class="app" aria-label="A chat app, standing in for whatever you are working in">
    <div class="bar"><i></i><i></i><i></i><span>Chat</span></div>
    <div class="thread"><p>This window stands in for the app you are typing in. The rough draft below is what you wrote. Press <strong>P</strong> (the app's shortcut is ⌥⇧P) or click Dash. Drag Dash anywhere you like.</p></div>
    <div class="field" id="field" role="textbox" aria-readonly="true" aria-label="Message" tabindex="0"></div>
  </main>

  <div class="dock" aria-hidden="true">
    <i style="--c:#6b8cff"></i><i style="--c:#ffb86b"></i><i style="--c:#7ad3a8"></i><i style="--c:#e98bb0"></i><i style="--c:#c9c5d6"></i><i style="--c:#8f7ad6"></i>
  </div>

  <div class="pet" id="pet" data-corner="br" data-state="idle" style="visibility:hidden">
    <span class="trail" aria-hidden="true"><i></i><i></i></span>
    <section class="bubble" id="bubble" role="dialog" aria-label="Dash" aria-hidden="true">
      <div class="bubble-in">
        <div class="say" id="say" aria-live="polite"></div>
        <div class="chips" id="chips" hidden></div>
        <form class="act" id="act" hidden><button class="pill" id="go" type="submit"></button></form>
      </div>
    </section>
    <button type="button" class="pet-btn" id="petBtn" aria-label="Dash. Improve the prompt you are writing" aria-haspopup="dialog" aria-expanded="false">
      <span class="pet-grow"><span class="pet-body" id="dashHost"></span></span>
    </button>
    <div class="pet-hint" aria-hidden="true"><kbd>⌥⇧P</kbd> improve your prompt</div>
    <div class="pet-menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-menu="move">Move to the next corner</button>
      <button type="button" role="menuitem" data-menu="home">Back to the default corner</button>
      <button type="button" role="menuitem" data-menu="hour">Hide for 1 hour</button>
      <button type="button" role="menuitem" data-menu="away">Hide until I press the shortcut</button>
    </div>
  </div>

<script type="module">
var yt=`#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`,bt=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform mat3 uRot; uniform vec3 uOff; uniform vec2 uScale;
uniform vec4 uB1; uniform vec4 uB2; uniform float uTail; uniform vec2 uRoll; uniform vec2 uLobes; uniform float uFace; uniform mat3 uPaint;
uniform vec4 uEyeW; uniform vec4 uEye; uniform float uLid;
uniform float uGlow; uniform float uFlow; uniform float uAlpha;
out vec4 o;
const float VIEW = ${6.4.toFixed(1)};
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
vec3 local(vec3 p){ vec3 q = p - uOff; q.xy /= uScale; return q * uRot; }
// A cone with rounded ends, from a (radius r1) to b (radius r2).
float cone(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba = b - a, pa = p - a; float l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1.0 / l2;
  float y = dot(pa, ba), z = y - l2; vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv), y2 = y * y * l2, z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
// The flat drawing's outline: a round head and two lobes at its lower left, the tail and a smaller one under it.
// Both lobes are the same solid, a cone with a wide root buried in the head and a rounded tip of the same size,
// laid out on the drawing's own measurements. They lie flat in the picture plane and follow the body's tilt,
// squash and lean, but not the head's turn: the face turns on the head while the lobes stay on its outline.
// uTail is the angle the tail is held at; the smaller lobe follows it a little.
float shape(vec3 t){
  float d = length(t) - 1.0;
  float c = cos(uTail), s = sin(uTail), ch = cos(uTail * 0.3), sh = sin(uTail * 0.3);
  vec2 r1 = vec2(-0.825, -0.22), r2 = vec2(-0.538, -0.554);
  float tail = cone(t, vec3(r1, 0.0), vec3(r1 + mat2(c, s, -s, c) * vec2(-0.401, -0.204), 0.0), 0.319, 0.115);
  float lobe = cone(t, vec3(r2, 0.0), vec3(r2 + mat2(ch, sh, -sh, ch) * vec2(-0.212, -0.212), 0.0), 0.322, 0.11);
  d = smin(d, tail, 0.22);
  d = smin(d, lobe, 0.07);
  return d;
}
// uLobes is how much of the lobes is there: as drawn, on the left (x), and as their mirror image on the right (y).
// To face the other way one pair sinks into the head while the other grows out of it. Nothing turns round.
float body(vec3 b){
  vec3 t = vec3(uRoll.x * b.x + uRoll.y * b.y, uRoll.x * b.y - uRoll.y * b.x, b.z);
  float d = shape(t);

<script type="module">
const $ = (id) => document.getElementById(id);
const pet = $('pet'), btn = $('petBtn'), bubble = $('bubble'), say = $('say'), chips = $('chips'), act = $('act'), go = $('go');
const field = $('field'), menu = $('menu');
const root = document.documentElement;

// ---------- canned content (the product supplies all of this in the app) ----------
const DRAFT = 'make me a landing page for my dog walking business, modern, with prices';
const QUESTION = { ask: 'One thing first: one page, or a full site?', options: ['One page', 'A full site with a booking page'] };
const prompt = (scope, extra) => [
  `Build ${scope === 'A full site with a booking page' ? 'a small website (home, prices, booking)' : 'a one-page landing site'} for a dog-walking business in [city].`,
  'Audience: busy dog owners comparing local walkers on their phone.',
  'Include: a headline with the main promise, three services with prices ([30-minute walk], [60-minute walk], [day care]), two customer reviews, and a booking button that opens [booking link].',
  'Style: modern and warm, large photos, one accent colour, readable at 375 px wide.',
  `Output: ${scope === 'A full site with a booking page' ? 'one HTML file per page with a shared stylesheet' : 'a single HTML file with embedded CSS'}, no frameworks.`,
  ...extra.map((line) => `Also: ${line}`),
].join('\n');

// ---------- Dash: the 3D one from the landing page ----------
const SIZE = 72, HEIGHT = Math.round((SIZE * 164) / 176), EDGE = 12, MENUBAR = 28, DOCK = 84, GAP = -12, IDLE_DIM_MS = 30000;
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let forcedCalm = false;
const calm = () => forcedCalm || motionQuery.matches;
let mood = 'idle', live = null;
// In 3D Dash turns its head and eyes towards the pointer and faces whichever side it is on (createDash does both).
// With reduced motion it is the flat drawing, which holds still.
function makeDash() {
  live?.destroy();
  live = window.Dash.createDash($('dashHost'), { size: SIZE, tile: false, follow: true, label: '', mood, render: calm() ? 'svg' : 'auto' });
}
const dash = { setMood(next) { mood = next; live.setMood(next); }, hop() { live.hop(); } };
const syncCalm = () => { root.classList.toggle('calm', calm()); makeDash(); rest(); };
motionQuery.addEventListener('change', syncCalm);

const wait = (ms) => new Promise((done) => setTimeout(done, calm() ? Math.min(ms, 60) : ms));
let run = 0; // every flow takes a number; a newer flow makes the older one stop at its next step
let phase = 'closed'; // closed | thinking | asking | writing | done | ready | error
let open = false, text = '', scope = QUESTION.options[0], extra = [], returnFocus = null, dimTimer = 0, moodTimer = 0;

const setMood = (next) => { clearTimeout(moodTimer); dash.setMood(next); };
function setState(state) {
  pet.dataset.state = state;
  clearTimeout(dimTimer);
  pet.classList.remove('is-dim');
  if (state === 'idle') dimTimer = setTimeout(() => pet.classList.add('is-dim'), IDLE_DIM_MS);
}

// ---------- where Dash sits: anywhere you drop it ----------
// `goal` is where Dash should be, `pos` where it is drawn. While held, pos trails the pointer; let go, and a soft
// spring carries it the rest of the way. The speed of that motion is what tilts and stretches the body.
const pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, goal = { x: 0, y: 0 };
let held = false, loop = 0, lastTime = 0, owed = 0;
const STEP_MS = 1000 / 120; // the motion is worked out in fixed steps, so it is the same on a 60 Hz and a 120 Hz screen
const limit = (value, low, high) => Math.min(Math.max(value, low), Math.max(low, high));
const bounds = () => ({ minX: EDGE, maxX: innerWidth - EDGE - SIZE, minY: MENUBAR + EDGE, maxY: innerHeight - EDGE - HEIGHT });
const inside = (point) => { const b = bounds(); return { x: limit(point.x, b.minX, b.maxX), y: limit(point.y, b.minY, b.maxY) }; };
const home = () => ({ x: innerWidth - 16 - SIZE, y: innerHeight - DOCK - 16 - HEIGHT }); // bottom right, clear of the Dock
const CORNERS = ['br', 'bl', 'tl', 'tr'];
const cornerSpot = (corner) => ({ x: corner[1] === 'r' ? home().x : 16, y: corner[0] === 'b' ? home().y : MENUBAR + 16 });
// The place is kept as a share of the free room, so it survives a window of another size.
function recall() {
  try {
    const kept = JSON.parse(localStorage.getItem('dash-place'));
    if (!kept || !Number.isFinite(kept.fx) || !Number.isFinite(kept.fy)) return null;
    const b = bounds();
    return inside({ x: b.minX + kept.fx * (b.maxX - b.minX), y: b.minY + kept.fy * (b.maxY - b.minY) });
  } catch { return null; }
}
function remember() {
  const b = bounds();
  try { localStorage.setItem('dash-place', JSON.stringify({ fx: (goal.x - b.minX) / Math.max(1, b.maxX - b.minX), fy: (goal.y - b.minY) / Math.max(1, b.maxY - b.minY) })); } catch { /* private window: the place lasts for this visit */ }
}
function forget() { try { localStorage.removeItem('dash-place'); } catch { /* nothing was kept */ } }
function paint(tilt = 0, sx = 1, sy = 1) {
  pet.style.setProperty('--x', `${pos.x.toFixed(2)}px`);
  pet.style.setProperty('--y', `${pos.y.toFixed(2)}px`);
  pet.style.setProperty('--tilt', `${tilt.toFixed(2)}deg`);
  pet.style.setProperty('--sx', sx.toFixed(3));
  pet.style.setProperty('--sy', sy.toFixed(3));
}
/** Stop exactly on the goal, upright. Also the whole of the motion when reduced motion is on. */
function rest() {
  cancelAnimationFrame(loop); loop = 0;
  pos.x = goal.x; pos.y = goal.y; vel.x = vel.y = 0;
  paint();
}
function step() {
  if (held) {
    const fromX = pos.x, fromY = pos.y;
    pos.x += (goal.x - pos.x) * 0.2; pos.y += (goal.y - pos.y) * 0.2; // a little behind the pointer
    vel.x = pos.x - fromX; vel.y = pos.y - fromY;
  } else {
    vel.x = (vel.x + (goal.x - pos.x) * 0.03) * 0.86; vel.y = (vel.y + (goal.y - pos.y) * 0.03) * 0.86; // a soft spring
    pos.x += vel.x; pos.y += vel.y;
  }
}
function frame(time) {
  owed += Math.min(50, time - (lastTime || time));
  lastTime = time;
  for (; owed >= STEP_MS; owed -= STEP_MS) step();
  const speed = Math.hypot(vel.x, vel.y), stretch = Math.min(0.14, speed * 0.012), sideways = Math.abs(vel.x) >= Math.abs(vel.y);
  paint(limit(vel.x * 2.4, -18, 18), sideways ? 1 + stretch : 1 - stretch * 0.7, sideways ? 1 - stretch * 0.7 : 1 + stretch);
  if (!held && speed < 0.02 && Math.hypot(goal.x - pos.x, goal.y - pos.y) < 0.2) rest();
  else loop = requestAnimationFrame(frame);
}
function move() {
  if (calm()) return rest();
  if (!loop) { lastTime = 0; owed = 0; loop = requestAnimationFrame(frame); }
}
/** The bubble opens towards the middle of the screen, and slides back along Dash when it would leave the screen. */
function side() {
  pet.dataset.corner = `${goal.y + HEIGHT / 2 < (innerHeight + MENUBAR) / 2 ? 't' : 'b'}${goal.x + SIZE / 2 < innerWidth / 2 ? 'l' : 'r'}`;
  const height = bubble.offsetHeight, up = pet.dataset.corner[0] === 'b';
  const over = up ? MENUBAR + 8 - (goal.y - GAP - height) : goal.y + HEIGHT + GAP + height - (innerHeight - 8);
  const nudge = Math.max(0, Math.round(over));
  pet.style.setProperty('--nudge', `${nudge}px`);
  pet.classList.toggle('is-nudged', nudge > 4);
}
function goTo(point, { keep = true } = {}) {
  Object.assign(goal, inside(point));
  if (keep) remember();
  side();
  move();
}
Object.assign(goal, recall() ?? home());
makeDash();
root.classList.toggle('calm', calm());
rest();
side();
pet.style.visibility = '';
new ResizeObserver(side).observe(bubble);
addEventListener('resize', () => { Object.assign(goal, recall() ?? home()); rest(); side(); });

// ---------- the bubble ----------
function el(tag, cls, content) { const node = document.createElement(tag); if (cls) node.className = cls; if (content != null) node.textContent = content; return node; }
/** What Dash is thinking: some lines, then at most one row of choices or one button. */
function show({ lines = [], status = '', options = [], action = '' }) {
  say.replaceChildren();
  for (const line of lines) say.append(line);
  if (status) {
    const p = el('p', 'lead', status);
    const dots = el('span', 'dots');
    dots.setAttribute('aria-hidden', 'true');
    dots.append(el('i'), el('i'), el('i'));
    p.append(dots);
    say.append(p);
  }
  chips.replaceChildren(...options.map((option) => { const chip = el('button', 'chip', option); chip.type = 'button'; chip.addEventListener('click', () => answer(option)); return chip; }));
  chips.hidden = !options.length;
  act.hidden = !action;
  if (action) setGo(action);
  say.scrollTo({ top: 0, behavior: calm() ? 'auto' : 'smooth' });
  more();
}
/** Fades the answer's last line while there is more of it below. */
function more() { say.classList.toggle('has-more', say.scrollHeight - say.scrollTop - say.clientHeight > 4); }
say.addEventListener('scroll', more, { passive: true });
function setGo(label) { go.replaceChildren(label, Object.assign(el('kbd', '', '↵'), { ariaHidden: 'true' })); }
/** The prompt as paragraphs, every word its own span so that it can appear word by word without the bubble changing size. */
function promptLines(source) {
  const words = [];
  const lines = source.split('\n').map((line) => {
    const p = el('p');
    for (const part of line.split(/(\[[^\]]+\])/)) {
      if (!part) continue;
      const holder = part.startsWith('[') ? p.appendChild(el('mark')) : p;
      for (const piece of part.split(/(\s+)/)) {
        if (!piece.trim()) { holder.append(piece); continue; }
        const word = el('span', 'w', piece);
        words.push(word);
        holder.append(word);
      }
    }
    return p;
  });
  return { lines, words };
}

async function openBubble() {
  if (open) return;
  open = true;
  returnFocus = document.activeElement === btn ? btn : field;
  closeMenu();
  pet.classList.remove('is-away', 'is-settle');
  setState('awake');
  pet.classList.add('is-awake');
  dash.hop(); // perk up: one hop while growing from 56 to 72 px
  pet.classList.add('is-open', 'is-text'); // the two drops, then the bubble, then the words (delays are in the CSS)
  bubble.setAttribute('aria-hidden', 'false');
  btn.setAttribute('aria-expanded', 'true');
}
async function dismiss({ happy = false } = {}) {
  if (!open) return;
  const id = ++run;
  open = false; phase = 'closed';
  pet.classList.remove('is-text'); // words first
  await wait(90);
  pet.classList.remove('is-open'); // then the bubble folds back into Dash
  bubble.setAttribute('aria-hidden', 'true');
  btn.setAttribute('aria-expanded', 'false');
  if (bubble.contains(document.activeElement)) (returnFocus ?? btn).focus({ preventScroll: true });
  await wait(240);
  if (id !== run) return;
  pet.classList.remove('is-awake');
  if (!happy) setMood('idle');
  await wait(happy ? 1100 : 260);
  if (id !== run) return;
  setMood('idle');
  if (!calm()) { pet.classList.add('is-settle'); setTimeout(() => pet.classList.remove('is-settle'), 520); }
  await wait(600);
  if (id !== run) return;
  setState('idle'); // and it dozes off
}

// ---------- the flow: the same phases the app has today ----------
async function shortcut() {
  if (pet.classList.contains('is-away')) { pet.classList.remove('is-away'); await wait(200); }
  if (open && phase !== 'error') return;
  const id = ++run;
  const finished = field.classList.contains('is-done');
  await openBubble();
  if (finished) return ready();
  thinking('Reading your draft');
  await wait(1500);
  if (id !== run) return;
  ask();
}
function thinking(status) {
  phase = 'thinking';
  setMood('thinking');
  show({ status });
}
function ask() {
  phase = 'asking';
  setMood('curious');
  show({ lines: [el('p', 'lead', QUESTION.ask)], options: QUESTION.options });
  focusAction();
}
async function answer(choice) {
  if (choice) scope = choice;
  await write('Writing your prompt');
}
async function write(status) {
  const id = ++run;
  thinking(status);
  await wait(1100);
  if (id !== run) return;
  phase = 'writing';
  text = prompt(scope, extra);
  const { lines, words } = promptLines(text);
  show({ lines });
  for (const word of words) {
    word.classList.add('on');
    const below = word.offsetTop + word.offsetHeight - say.clientHeight; // keep the word being written in view
    if (below > say.scrollTop) say.scrollTop = below;
    if (!calm()) await wait(16);
    if (id !== run) return;
  }
  phase = 'done';
  setMood('done'); // happy eyes and one hop
  show({ lines, action: 'Insert' });
  focusAction();
  moodTimer = setTimeout(() => { if (phase === 'done') dash.setMood('idle'); }, 1600);
}
function ready() {
  phase = 'ready';
  setMood('done');
  show({ lines: [el('p', 'lead', 'This already reads like a finished prompt.'), el('p', '', 'I would send it as it is. Fill in the parts in [brackets] first.')] });
}
async function fail() {
  ++run;
  await openBubble();
  phase = 'error';
  setMood('oops'); // worried eyes and one shake
  show({ lines: [el('p', 'lead', "I couldn't reach First Try."), el('p', '', 'Your draft is untouched. Check your connection.')], action: 'Try again' });
  focusAction();
}
function insert() {
  field.textContent = text;
  field.classList.add('is-filled', 'is-done');
  setTimeout(() => field.classList.remove('is-filled'), 1400);
  setMood('done');
  dash.hop();
  dismiss({ happy: true });
}
/** Focus goes to the one thing there is to press, so that Return does it. */
function focusAction() { setTimeout(() => { if (open) (act.hidden ? chips.querySelector('button') : go)?.focus({ preventScroll: true }); }, calm() ? 0 : 420); }
function reset() {
  ++run;
  extra = []; scope = QUESTION.options[0];
  field.textContent = DRAFT;
  field.classList.remove('is-done', 'is-filled');
  pet.classList.remove('is-away');
  forget();
  goTo(home(), { keep: false }); // back to the default corner
  if (open) dismiss();
}

act.addEventListener('submit', (event) => {
  event.preventDefault();
  if (phase === 'done') return insert();
  if (phase !== 'error') return;
  const id = ++run; // try again
  thinking('Reading your draft');
  wait(1500).then(() => { if (id === run) ask(); });
});
// A click anywhere else puts the thought away, as Esc does.
addEventListener('pointerdown', (event) => { if (open && !pet.contains(event.target) && !event.target.closest('.controls')) dismiss(); });

// ---------- click, drag anywhere, right-click ----------
const DRAG_AFTER_PX = 5; // less than this is a click
let drag = null, justDragged = false;
btn.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  btn.setPointerCapture(event.pointerId);
  drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY, offsetX: event.clientX - pos.x, offsetY: event.clientY - pos.y, moving: false };
});
btn.addEventListener('pointermove', (event) => {
  if (!drag || event.pointerId !== drag.id) return;
  if (!drag.moving && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < DRAG_AFTER_PX) return;
  if (!drag.moving) {
    drag.moving = true; held = true;
    pet.classList.add('is-drag');
    pet.classList.remove('is-settle');
    closeMenu();
    if (!open) { setState('held'); dash.setMood('curious'); }
  }
  Object.assign(goal, inside({ x: event.clientX - drag.offsetX, y: event.clientY - drag.offsetY }));
  move();
});
const drop = (event) => {
  if (!drag || event.pointerId !== drag.id) return;
  const was = drag;
  drag = null;
  if (!was.moving) return;
  held = false;
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 0);
  pet.classList.remove('is-drag');
  remember();
  side(); // the bubble comes back on whichever side now has the room
  move();
  if (!calm()) { pet.classList.add('is-settle'); setTimeout(() => pet.classList.remove('is-settle'), 520); }
  if (!open) { dash.setMood('idle'); setTimeout(() => { if (!open && !drag) setState('idle'); }, 700); }
};
btn.addEventListener('pointerup', drop);
btn.addEventListener('pointercancel', drop);
btn.addEventListener('click', () => { if (justDragged) return; if (open) dismiss(); else shortcut(); });

function closeMenu() { if (menu.hidden) return; menu.hidden = true; pet.classList.remove('has-menu'); }
pet.addEventListener('contextmenu', (event) => {
  event.preventDefault();
  if (open) return;
  menu.hidden = false;
  pet.classList.add('has-menu');
  menu.querySelector('button').focus({ preventScroll: true });
});
menu.addEventListener('click', (event) => {
  const item = event.target.closest('[data-menu]');
  if (!item) return;
  closeMenu();
  if (item.dataset.menu === 'move') {
    goTo(cornerSpot(CORNERS[(CORNERS.indexOf(pet.dataset.corner) + 1) % CORNERS.length]));
    btn.focus({ preventScroll: true });
  } else if (item.dataset.menu === 'home') {
    forget(); goTo(home(), { keep: false }); btn.focus({ preventScroll: true });
  } else {
    // In the app "1 hour" comes back on a timer. Here both stay away until the shortcut.
    ++run; pet.classList.add('is-away'); field.focus({ preventScroll: true });
  }
});
menu.addEventListener('keydown', (event) => {
  if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
  event.preventDefault();
  const items = [...menu.querySelectorAll('button')];
  items[(items.indexOf(document.activeElement) + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
});
addEventListener('pointerdown', (event) => { if (!menu.contains(event.target)) closeMenu(); });

// ---------- keys and the prototype's own controls ----------
const actions = {
  shortcut,
  thinking: async () => { ++run; await openBubble(); thinking('Reading your draft'); },
  question: async () => { ++run; await openBubble(); ask(); },
  error: fail,
  dismiss: () => dismiss(),
  calm: () => { forcedCalm = !forcedCalm; syncCalm(); document.querySelector('[data-do=calm]').setAttribute('aria-pressed', String(forcedCalm)); },
  wall: () => { const light = document.body.dataset.wall !== 'light'; document.body.dataset.wall = light ? 'light' : ''; document.querySelector('[data-do=wall]').setAttribute('aria-pressed', String(light)); },
  reset,
};
document.querySelector('.controls').addEventListener('click', (event) => { const button = event.target.closest('[data-do]'); if (button) actions[button.dataset.do](); });
addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { if (!menu.hidden) { closeMenu(); btn.focus(); } else dismiss(); return; }
  if (event.code === 'KeyP' && event.altKey && event.shiftKey) { event.preventDefault(); shortcut(); return; }
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = { p: 'shortcut', t: 'thinking', q: 'question', e: 'error', m: 'calm', w: 'wall' }[event.key.toLowerCase()];
  if (key) { event.preventDefault(); actions[key](); }
});

field.textContent = DRAFT;
setState('idle');
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }); };
tick(); setInterval(tick, 30000);
</script>
