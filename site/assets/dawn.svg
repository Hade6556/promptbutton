<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Blue mountains at dawn with the sun coming up behind them">
  <defs>
    <!-- Deep blue where the headline sits (white text stays readable), warming to dawn and ending in the page's white. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15357c"/>
      <stop offset="0.5" stop-color="#3769bd"/>
      <stop offset="0.66" stop-color="#8bb8ea"/>
      <stop offset="0.8" stop-color="#ffd9b0"/>
      <stop offset="0.92" stop-color="#fff3e4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd38a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb866" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb866" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c84cf"/>
      <stop offset="1" stop-color="#b9cff1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86a8e2"/>
      <stop offset="1" stop-color="#dbe7f9"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4d6f3"/>
      <stop offset="0.7" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2b8" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffe2b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe2b8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="180" cy="90" r="1.3"/><circle cx="420" cy="150" r="1"/><circle cx="760" cy="60" r="1.4"/><circle cx="1010" cy="120" r="1"/><circle cx="1320" cy="70" r="1.2"/><circle cx="1480" cy="190" r="1"/><circle cx="600" cy="230" r="0.9"/><circle cx="1180" cy="34" r="1"/>
  </g>
  <circle cx="1180" cy="640" r="400" fill="url(#glow)"/>
  <circle cx="1180" cy="640" r="58" fill="#fff8ea"/>
  <!-- far range: tall, so its peaks stand above whatever sits in front -->
  <path d="M0 690 L110 610 L200 650 L330 540 L400 600 L450 570 L540 640 L640 590 L720 630 L810 600 L900 645 L990 615 L1080 650 L1170 625 L1260 655 L1350 610 L1440 650 L1520 620 L1600 650 L1600 1000 L0 1000 Z" fill="url(#far)"/>
  <path d="M330 540 L400 600 L450 570 L462 580 L404 612 L338 556 Z M1350 610 L1440 650 L1520 620 L1528 628 L1442 662 L1354 622 Z" fill="#ffffff" opacity="0.55"/>
  <path d="M640 590 L720 630 L810 600 L900 645 L990 615 L1080 650 L1170 625 L1260 655 L1350 610 L1350 617 L1260 662 L1170 632 L1080 657 L990 622 L900 652 L810 607 L720 637 L640 597 Z" fill="url(#lit)"/>
  <path d="M0 790 L110 730 L220 765 L340 690 L450 745 L560 705 L680 760 L790 715 L900 765 L1010 725 L1130 772 L1250 730 L1370 772 L1490 745 L1600 775 L1600 1000 L0 1000 Z" fill="url(#mid)"/>
  <path d="M0 880 L140 840 L260 868 L400 820 L540 862 L690 830 L840 872 L990 840 L1140 876 L1290 846 L1440 878 L1600 856 L1600 1000 L0 1000 Z" fill="url(#near)"/>
</svg>
